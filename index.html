<script>
const C = {
  ink: "#2A2C49", panel: "#3A3E66", primary: "#505EA3", primarySoft: "#E8EAF4",
  accent: "#EC3252", workspace: "#F1F2F1", card: "#FFFFFF", line: "#E0E1E6",
  text: "#3B3C3B", muted: "#6A6D6A", pos: "#1E7A54", neg: "#D63046", input: "#1F4FA8",
  light: "#9AA3D1", grey: "#B9BAC2",
};
const TARGET = 0.15;
const annuity = (P, r, n) => (r > 1e-9 ? (P * r) / (1 - Math.pow(1 + r, -n)) : P / n);
function irr(cfs) {
  const f = (r) => cfs.reduce((s, cf, t) => s + cf / Math.pow(1 + r, t), 0);
  let lo = -0.95, hi = 1, fLo = f(lo), fHi = f(hi), n = 0;
  while (fLo * fHi > 0 && hi < 1000 && n < 200) { hi *= 1.4; fHi = f(hi); n++; }
  if (fLo * fHi > 0) return null;
  for (let i = 0; i < 240; i++) {
    const m = (lo + hi) / 2, fm = f(m);
    if (Math.abs(fm) < 1e-8) return m;
    if (fLo * fm < 0) { hi = m; fHi = fm; } else { lo = m; fLo = fm; }
  }
  return (lo + hi) / 2;
}
const npv = (r, cfs) => cfs.reduce((s, cf, t) => s + cf / Math.pow(1 + r, t), 0);
function payback(cfs) {
  let c = 0;
  for (let t = 0; t < cfs.length; t++) {
    const p = c; c += cfs[t];
    if (c >= 0 && p < 0) return t - 1 + (0 - p) / (c - p);
  }
  return null;
}

/* Derived defaults (kept out of the input state so PMs don't have to touch them) */
function effTenor(p){
  if (p.tenorAuto === false) return Math.max(1, Math.round(p.tenor));
  const base = (p.ppaTerm && p.ppaTerm > 0) ? p.ppaTerm : p.projectLife;
  return Math.max(1, Math.min(Math.round(base) - 2, 20));
}
function effShlRate(p){ return p.shlRateAuto === false ? p.shlRate : (p.interest + 1); }
function parseProd(p){ return String(p.prodSeries||"").split(/[^0-9.\-]+/).map(x=>parseFloat(x)).filter(x=>isFinite(x)&&x>0); }
function prodCountText(p){ const a=parseProd(p), N=Math.round(p.projectLife); if(!a.length) return "no series — flat fallback"; let s=a.length+" / "+N+" yrs"; if(a.length<N) s+=" · last carried forward"; else if(a.length>N) s+=" · extra ignored"; return s; }
function effProd(p){
  const N=Math.max(1,Math.round(p.projectLife)); const a=parseProd(p); const out=[];
  for(let t=1;t<=N;t++){
    if(a.length) out.push(a[Math.min(t-1,a.length-1)]);
    else { const deg=t===1?1-p.degY1/100:(1-p.degY1/100)*Math.pow(1-p.degAnnual/100,t-1); out.push((p.prodAnnual||0)*deg); }
  }
  return out;
}
function prodGridHTML(p){
  const v=effProd(p);
  return '<div class="pgrid">'+v.map((x,i)=>'<div class="pcell"><span>Y'+(i+1)+'</span><input type="number" step="any" value="'+Math.round(x)+'" oninput="setProdCell('+i+',this.value)"></div>').join('')+'</div>';
}
function prodChartHTML(p){
  const v=effProd(p), n=v.length; if(!n) return '';
  const W=320,H=64,mB=11,mT=4, max=Math.max(...v,1), bw=W/n;
  const bars=v.map((x,i)=>{const h=Math.max(0,(H-mT-mB)*(x/max));return '<rect x="'+(i*bw+bw*0.12).toFixed(1)+'" y="'+(H-mB-h).toFixed(1)+'" width="'+(bw*0.76).toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+C.primary+'" rx="1"><title>Y'+(i+1)+': '+nf.format(Math.round(x))+' MWh</title></rect>';}).join('');
  let xl=''; [0,Math.floor((n-1)/2),n-1].forEach(i=>{ xl+='<text x="'+(i*bw+bw/2).toFixed(1)+'" y="'+(H-2)+'" font-size="8" fill="'+C.muted+'" text-anchor="middle">Y'+(i+1)+'</text>'; });
  return '<div class="pchart"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:64px">'+bars+xl+'</svg></div>';
}

// #3 — cumulative escalation factor for year t (year 1 = 1.0). If periodic, each year escalates at the
//      rate of its period block (period 0 = Y1..plen, period 1 = Y(plen+1)..2*plen, ...); else flat rate.
function escalFactor(t, flatIdx, periodic, rates, plen){
  if(!periodic || !Array.isArray(rates) || !rates.length) return Math.pow(1 + (flatIdx||0)/100, t-1);
  const L = Math.max(1, Math.round(plen||5));
  let f = 1;

  let pvCost = hardCapex + grantUse + vatLost, pvPay = 0, pvE = 0;   // V22 — non-recoverable VAT is a real cost   // V12.1 — capitalised SEFA dev cost is part of the asset cost
  rows.forEach((x, i) => { const df = Math.pow(1 + disc, i + 1); pvCost += (x.opex + x.recapex) / df; pvPay += (x.revEnergy + x.revLeasing + x.revBess) / df; pvE += x.energySold / df; });
  const lcoeProject = pvE > 0 ? pvCost / pvE : null;
  const lcoeOfftaker = pvE > 0 ? pvPay / pvE : null;

  const projSeries = [-(hardCapex + grantUse + vatInput + wcCap), ...rows.map((x) => x.projectFCF)];   // V22 — input VAT out at FC, recoveries in projectFCF   // V12.1 — SEFA reimbursement is a project cost financed at FC
  const priEqConstr = p.priEqOn ? (equityCash / 2) * (p.priEqCover / 100) * (p.priEqRate / 100) * Tc : 0;   // V22 — sponsor-paid, during construction
  const equitySeries = [-equityCash + successFee - priEqConstr, ...rows.map((x) => x.aegFCF)];
  // V22 — VAT now flows through the funding plan and the waterfall (no ad-hoc IRR adjustment needed).
  const toUSD = (arr) => arr.map((cf, t) => cf / (p.fx * Math.pow(1 + p.fxDep / 100, t)));
  const dscrs = rows.filter((x) => x.dscr !== null).map((x) => x.dscr);
  const cfadsDL = rows.slice(0, debtEnd).map((x) => x.cfads);
  const cfadsAll = rows.map((x) => x.cfads);   // V11 — full project life, for PLCR
  const llcrs = rows.filter((x) => x.llcr != null).map((x) => x.llcr);
  const plcrs = rows.filter((x) => x.plcr != null).map((x) => x.plcr);

  return {
    epcPV, epcBESS, duties, contingency, successFee, hardCapex, baseCost, idc, upfront,
    vatInput, vatRecoverable, vatLost, vatRecoverYr, vatFac0, vatFacIDC, vatUses, vatWriteOff, vatRecTotal, vatFunding, vatRecMode,
    bs0, epcLump, esConstr, equityCash, shlIDC, bankFeesC, finCostsC, refiYears, debtEnd, wcCap, priDC, priEqConstr, bessUnitCapex, augYears, recapexEvents,
    commitment, dsraInit, dsraFunded, totalFunding, debt: D, equityTotal, shl0, tenor, shlRate,
    grant, grantUse, grantSource: grantApplied, netFunding,
    sizingDSCR, bindGearing, gearingDebt, sculptCap, pvAC, pvDC, rows,
    kpis: {
      projIRR: irr(projSeries), projIRRusd: irr(toUSD(projSeries)),
      eqIRR: irr(equitySeries), eqIRRusd: irr(toUSD(equitySeries)),
      npvProj: npv(p.discount / 100, projSeries),
      pbProj: payback(projSeries), pbEq: payback(equitySeries),
      minDSCR: dscrs.length ? Math.min(...dscrs) : null,
      avgDSCR: dscrs.length ? dscrs.reduce((a, b) => a + b, 0) / dscrs.length : null,
      llcr: D > 0 ? npv(iEff, [0, ...cfadsDL]) / D : null,

/* ---- Sensitivities ---- */
function computeSensi(p) {
  const eq = (patch) => buildModel({ ...p, ...patch }).kpis.eqIRR;
  const steps = [-15, -10, -5, 0, 5, 10, 15];
  // #8 — CapEx sensitivity: −5% to +5% in 2% steps (the range usually achievable), plus −10% / +10% wings.
  const capexSteps = [-10, -5, -3, -1, 0, 1, 3, 5, 10];
  const capex = capexSteps.map((d) => ({ d, irr: eq({ capexMult: 1 + d / 100 }) }));
  const opex = steps.map((d) => ({ d, irr: eq({ opexMult: 1 + d / 100 }) }));
  const gearing = [60, 65, 70, 75, 80, 85].map((g) => ({ g, irr: eq({ gearing: g }) }));
  const base_i = p.interest;
  const rate = [-2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2].map((d) => ({ d, i: base_i + d, irr: eq({ interest: base_i + d }) }));
  const base = p.tariffCt;
  const pvTar = [-3, -2, -1, 0, 1, 2, 3].map((d) => {
    const tc = Math.max(0, base + d);
    const m = buildModel({ ...p, tariffCt: tc }); return { tc, eq: m.kpis.eqIRR, proj: m.kpis.projIRR };
  });
  const solve = (target) => {
    let lo = 0, hi = 60;
    for (let i = 0; i < 44; i++) { const mid = (lo + hi) / 2; const r = buildModel({ ...p, tariffCt: mid }).kpis.eqIRR; if (r == null || r < target / 100) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  };
  const tarForTarget = [10, 12, 14, 15, 16, 18].map((t) => ({ t, tariff: solve(t) }));
  const leasing = (p.leasingOn && p.leasingAnnual > 0)
    ? [-15, -10, -5, 0, 5, 10, 15].map((d) => ({ d, val: p.leasingAnnual * (1 + d / 100), irr: eq({ leasingAnnual: p.leasingAnnual * (1 + d / 100) }) }))
    : null;
  return { capex, opex, gearing, rate, pvTar, tarForTarget, leasing };
}

function periodRatesHTML(){

  const nP=Math.max(1,Math.ceil(N/L));
  if(!Array.isArray(p.tariffIdxPeriods)) p.tariffIdxPeriods=[];
  for(let i=0;i<nP;i++){ if(!isFinite(p.tariffIdxPeriods[i])) p.tariffIdxPeriods[i]= (p.tariffIdxPeriods.length? p.tariffIdxPeriods[Math.min(i,p.tariffIdxPeriods.length-1)] : (p.tariffIdx||0)); }
  p.tariffIdxPeriods.length=nP;
  let h='';
  for(let i=0;i<nP;i++){

}

        if (p.vatFunding==="facility") g += field("VAT facility rate","vatFacilityRate","%");
        g += '<div class="help">Recovery</div>';
        g += seg("vatRecovery",[["offset","Offset vs VAT on sales (standard)"],["refund","Refund (lump sum)"]]);
        if (p.vatRecovery==="offset") g += field("VAT-able share of sales","vatSalesPct","%");
        else g += field("Refund lag","vatRefundMonths","months","1");
        g += help("Input VAT is a <b>use</b> at financial close. "
          + ({debtEquity:"It is funded pro-rata by senior debt and equity (inside the gearing base).",facility:"The recoverable part is funded by a dedicated VAT facility (interest rolled up during construction, then paid yearly) that is swept by every recovery; the non-recoverable part is financed like any project cost.",equity:"It is funded by equity only (outside the gearing base)."}[p.vatFunding||"debtEquity"])
          + " " + (p.vatRecovery==="offset" ? "Recovered by <b>imputing the credit</b> against the net output VAT collected on sales (VAT on VAT-able revenue minus input VAT on OpEx) — not revenue: it unwinds a receivable. Any credit left at the end is written off."
                                          : "Recovered as a <b>cash refund</b> after the lag.")
          + " Recoveries sit below debt service (not in CFADS / DSCR). The non-recoverable share is capitalised into the asset.");
      }
      s += collapse("tax_vat","VAT on CapEx", g, p.vatOn, p.vatOn?"on":""); }
    s += sub("FX &amp; discounting");
    if (p.ccy!=="USD") s += field("FX ("+p.ccy+" per USD)","fx","")+field("FX depreciation vs USD","fxDep","%/yr");
    s += field("Discount rate","discount","%");
    s += help("BP currency is set in the Overview tab. FX depreciation is used only to translate IRR into USD.");
  }
  return head + '<div class="card pad">'+s+'</div>'
    + help('<b style="color:'+C.input+'">Blue</b> values are inputs. Defaults inspired by real models (Mauritius base).');
}

/* ---------------- CHART HELPERS ---------------- */
function AXT(lo,hi,n){
  if(hi<=lo) hi=lo+1;
  const nn=(r,round)=>{const e=Math.floor(Math.log10(r)),f=r/Math.pow(10,e);let m;if(round){m=f<1.5?1:f<3?2:f<7?5:10;}else{m=f<=1?1:f<=2?2:f<=5?5:10;}return m*Math.pow(10,e);};
  const step=nn(nn(hi-lo,false)/(n-1),true);
  const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,out=[];
  for(let v=a;v<=b+step*0.001;v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}
function fmtAx(v,step){ return Math.abs(step)<1?v.toFixed(1):nf.format(v); }
const tipEsc = (s)=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function hoverBands(mL,mT,H,mB,xw,n,tips){ let r=''; for(let i=0;i<n;i++){ r+='<rect x="'+(mL+i*xw).toFixed(1)+'" y="'+mT+'" width="'+xw.toFixed(1)+'" height="'+(H-mT-mB)+'" fill="#000" fill-opacity="0" pointer-events="all" onmousemove="tip(event,\''+tips[i]+'\')" onmouseout="tipHide()"/>'; } return r; }

function chartSVG(rows, equity, hideCumul) {
  const W=720,H=210,mL=56,mR=40,mT=8,mB=18,n=rows.length;
  const aeg=rows.map(r=>r.aegFCF/1000); let c=-equity/1000; const cum=aeg.map(v=>c+=v);
  const dscr=rows.map(r=>r.dscr);
  const all=hideCumul?[...aeg,0]:[...aeg,...cum,0]; let lo=Math.min(...all),hi=Math.max(...all);   // V12 — optionally exclude the cumulative line so bars aren't crushed
  const tk=AXT(lo,hi,5); lo=tk[0]; hi=tk[tk.length-1]; const stepL=tk.length>1?tk[1]-tk[0]:1;
  const dMax=Math.max(2,...dscr.filter(x=>x!=null)); const tkR=AXT(0,dMax,4); const dHi=tkR[tkR.length-1];
  const xw=(W-mL-mR)/n;
  const yL=v=>mT+(H-mT-mB)*(1-(v-lo)/((hi-lo)||1));
  const yR=v=>mT+(H-mT-mB)*(1-v/dHi);
  let grid="",axL="",axR="";
  tk.forEach(t=>{const y=yL(t);grid+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="'+C.line+'"/>';axL+='<text x="'+(mL-5)+'" y="'+(y+3)+'" font-size="9" fill="'+C.muted+'" text-anchor="end">'+fmtAx(t,stepL)+'</text>';});
  tkR.forEach(t=>{axR+='<text x="'+(W-mR+5)+'" y="'+(yR(t)+3)+'" font-size="9" fill="'+C.neg+'" text-anchor="start">'+t.toFixed(1)+'x</text>';});
  let bars=""; aeg.forEach((v,i)=>{const x=mL+i*xw+xw*0.15,w=xw*0.7,y0=yL(0),y1=yL(v);bars+='<rect x="'+x+'" y="'+Math.min(y0,y1)+'" width="'+w+'" height="'+Math.abs(y1-y0)+'" fill="'+C.primary+'" rx="1"/>';});
  const poly=(arr,sc,col,dash)=>{const pts=arr.map((v,i)=>v==null?null:(mL+i*xw+xw/2)+","+sc(v)).filter(Boolean).join(" ");return '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2"'+(dash?' stroke-dasharray="4 2"':'')+'/>';};
  const zero='<line x1="'+mL+'" y1="'+yL(0)+'" x2="'+(W-mR)+'" y2="'+yL(0)+'" stroke="'+C.muted+'" stroke-width="1"/>';
  let xl=""; rows.forEach((r,i)=>{ if(i%3===0||i===n-1) xl+='<text x="'+(mL+i*xw+xw/2)+'" y="'+(H-4)+'" font-size="9" fill="'+C.muted+'" text-anchor="middle">Y'+r.year+'</text>';});
  const tips=rows.map((r,i)=>tipEsc('Y'+r.year+'<br>Annual: '+k(r.aegFCF)+'<br>Cumulative: '+nf.format(cum[i])+'<br>DSCR: '+(r.dscr==null?'—':xd(r.dscr))));
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:210px">'+grid+zero+bars+(hideCumul?'':poly(cum,yL,C.ink))+poly(dscr,yR,C.neg,true)+axL+axR+xl+hoverBands(mL,mT,H,mB,xw,n,tips)+'</svg>';
}

function stackedChart(rows, bars, lines) {
  const hasR=lines.some(l=>l.axis==="right");
  const W=720,H=190,mL=56,mR=(hasR?40:14),mT=8,mB=18,n=rows.length;
  const tot=rows.map(r=>bars.reduce((s,b)=>s+(r[b.key]||0),0)/1000);
  let lv=[...tot,0]; lines.filter(l=>l.axis!=="right").forEach(l=>rows.forEach(r=>lv.push((r[l.key]||0)/1000)));
  let lo=Math.min(...lv),hi=Math.max(...lv);
  const tk=AXT(lo,hi,5); lo=tk[0]; hi=tk[tk.length-1]; const stepL=tk.length>1?tk[1]-tk[0]:1;
  const rArr=lines.filter(l=>l.axis==="right").flatMap(l=>rows.map(r=>r[l.key]).filter(x=>x!=null));
  const rMax=Math.max(2,...(rArr.length?rArr:[2])); const tkR=AXT(0,rMax,4); const dHi=tkR[tkR.length-1];
  const xw=(W-mL-mR)/n;
  const yL=v=>mT+(H-mT-mB)*(1-(v-lo)/((hi-lo)||1));
  const yR=v=>mT+(H-mT-mB)*(1-v/dHi);
  let grid="",axL="",axR="";
  tk.forEach(t=>{const y=yL(t);grid+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="'+C.line+'"/>';axL+='<text x="'+(mL-5)+'" y="'+(y+3)+'" font-size="9" fill="'+C.muted+'" text-anchor="end">'+fmtAx(t,stepL)+'</text>';});
  if(hasR) tkR.forEach(t=>{axR+='<text x="'+(W-mR+5)+'" y="'+(yR(t)+3)+'" font-size="9" fill="'+C.neg+'" text-anchor="start">'+t.toFixed(1)+'x</text>';});
  let rects="";
  rows.forEach((r,i)=>{ let cum=0; bars.forEach(b=>{ const v=(r[b.key]||0)/1000; if(Math.abs(v)<1e-9) return; const y0=yL(cum),y1=yL(cum+v); rects+='<rect x="'+(mL+i*xw+xw*0.15)+'" y="'+Math.min(y0,y1)+'" width="'+(xw*0.7)+'" height="'+Math.abs(y1-y0)+'" fill="'+b.color+'"/>'; cum+=v; }); });
  let lps="";
  lines.forEach(l=>{ const sc=l.axis==="right"?yR:yL; const div=l.axis==="right"?1:1000; const pts=rows.map((r,i)=>r[l.key]==null?null:(mL+i*xw+xw/2)+","+sc((r[l.key])/div)).filter(Boolean).join(" "); lps+='<polyline points="'+pts+'" fill="none" stroke="'+l.color+'" stroke-width="2"'+(l.dash?' stroke-dasharray="4 2"':'')+'/>'; });
  const zero=lo<0?'<line x1="'+mL+'" y1="'+yL(0)+'" x2="'+(W-mR)+'" y2="'+yL(0)+'" stroke="'+C.muted+'"/>':'';
  let xl=""; rows.forEach((r,i)=>{ if(i%3===0||i===n-1) xl+='<text x="'+(mL+i*xw+xw/2)+'" y="'+(H-4)+'" font-size="9" fill="'+C.muted+'" text-anchor="middle">Y'+r.year+'</text>';});
  const tips=rows.map((r)=>{ let s='Y'+r.year; bars.forEach(b=>{ const v=r[b.key]||0; if(Math.abs(v)>=1) s+='<br>'+(b.name||b.key)+': '+k(v); }); lines.forEach(l=>{ const v=r[l.key]; if(v!=null) s+='<br>'+(l.name||l.key)+': '+(l.axis==="right"?xd(v):k(v)); }); return tipEsc(s); });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:190px">'+grid+zero+rects+lps+axL+axR+xl+hoverBands(mL,mT,H,mB,xw,n,tips)+'</svg>';
}

/* V11 — coverage-ratios chart: DSCR (per-year) + LLCR + PLCR over the debt tenor, with covenant lines */
function coverageChart(rows){
  // V22 — easier to read: DSCR as bars, LLCR as a solid line, PLCR as a dashed line; the axis is capped so the PLCR
  //        tail (which explodes as the debt runs off) no longer crushes everything — capped points get an arrow.
  const yrs = rows.filter(r=>r.balStart>1e-6 && (r.dscr!=null||r.llcr!=null||r.plcr!=null));
  const n = yrs.length; if(!n) return '<div class="help">No debt outstanding — coverage ratios not applicable.</div>';
  const W=460,H=250,mL=40,mR=10,mT=14,mB=22;   // drawn at (about) its displayed size so labels stay readable
  const core=[]; yrs.forEach(r=>{ [r.dscr,r.llcr].forEach(v=>{ if(v!=null&&isFinite(v)) core.push(v); }); });
  core.push(p.sculptDSCR||1.2, p.lockupDSCR||1.1);
  const cap=Math.max(2, Math.ceil((Math.max(...core)*1.35)*2)/2);        // headroom above DSCR/LLCR, in 0.5x steps
  const tk=AXT(0,cap,5); const hi=tk[tk.length-1];
  const xw=(W-mL-mR)/n, cx=i=>mL+xw*(i+0.5), yy=v=>mT+(H-mT-mB)*(1-Math.min(v,hi)/hi);
  let g='';
  tk.forEach(t=>{const y=yy(t).toFixed(1); g+='<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="'+C.line+'"/><text x="'+(mL-6)+'" y="'+(+y+3)+'" font-size="10" fill="'+C.muted+'" text-anchor="end">'+t.toFixed(1)+'x</text>';});
  // DSCR bars
  yrs.forEach((r,i)=>{ if(r.dscr==null) return; const y=yy(r.dscr), h=(H-mB)-y; g+='<rect x="'+(cx(i)-xw*0.32).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(xw*0.64).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'" fill="'+C.primary+'" opacity="0.28" rx="1.5"/>'; });
  // covenant lines, labelled on the left inside the plot
  const ref=(v,col,lbl,right)=>{ if(v==null||!isFinite(v)) return ''; const y=yy(v).toFixed(1); return '<line x1="'+mL+'" y1="'+y+'" x2="'+(W-mR)+'" y2="'+y+'" stroke="'+col+'" stroke-dasharray="5 3" stroke-width="1.2"/><text x="'+(right?(W-mR-4):(mL+4))+'" y="'+(right?(+y+11):(y-3))+'" font-size="9.5" fill="'+col+'" font-weight="700" text-anchor="'+(right?'end':'start')+'" paint-order="stroke" stroke="#fff" stroke-width="3">'+lbl+'</text>'; };
  if(p.repay==="sculpt") g+=ref(p.sculptDSCR,C.muted,"Target DSCR "+nf2.format(p.sculptDSCR)+"x");
  g+=ref(p.lockupDSCR,C.accent,"Lock-up "+nf2.format(p.lockupDSCR)+"x",1);
  const line=(key,col,dash,w)=>{ const pts=yrs.map((r,i)=>r[key]==null?null:cx(i).toFixed(1)+","+yy(r[key]).toFixed(1)).filter(Boolean).join(" "); return '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="'+(w||2.2)+'"'+(dash?' stroke-dasharray="5 3"':'')+' stroke-linejoin="round"/>'; };
  g+=line("plcr",C.accent,1,1.8)+line("llcr",C.ink,0,2.4);
  yrs.forEach((r,i)=>{ if(r.dscr!=null) g+='<circle cx="'+cx(i).toFixed(1)+'" cy="'+yy(r.dscr).toFixed(1)+'" r="2.6" fill="'+C.primary+'"/>';
    if(r.plcr!=null && r.plcr>hi) g+='<text x="'+cx(i).toFixed(1)+'" y="'+(mT+2)+'" font-size="9" fill="'+C.accent+'" text-anchor="middle">▲</text>'; });
  let xl=''; const step=n>12?3:2; yrs.forEach((r,i)=>{ if(i%step===0||i===n-1) xl+='<text x="'+cx(i).toFixed(1)+'" y="'+(H-6)+'" font-size="10" fill="'+C.muted+'" text-anchor="middle">Y'+r.year+'</text>'; });
  const tips=yrs.map(r=>tipEsc('Y'+r.year+'<br>DSCR: '+(r.dscr==null?'—':nf2.format(r.dscr)+'x')+'<br>LLCR: '+(r.llcr==null?'—':nf2.format(r.llcr)+'x')+'<br>PLCR: '+(r.plcr==null?'—':nf2.format(r.plcr)+'x')));
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;max-height:280px">'+g+xl+hoverBands(mL,mT,H,mB,xw,n,tips)+'</svg>';
}
/* radar / star chart for multi-criteria IRR stress */
function radarSVG(drivers, base){
  const W=380,H=320,cx=190,cy=158,R=112,n=drivers.length;
  const vals=drivers.map(d=>d.irr==null?0:Math.max(0,d.irr));
  const maxV=Math.max(base,TARGET,...vals)*1.2||0.2;
  const ang=i=>(-Math.PI/2 + i*2*Math.PI/n);
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];
  let grid="";
  [0.25,0.5,0.75,1].forEach(f=>{ const pts=drivers.map((_,i)=>pt(i,R*f).join(',')).join(' '); grid+='<polygon points="'+pts+'" fill="none" stroke="'+C.line+'"/>'; });
  let spokes="",labels="";
  drivers.forEach((d,i)=>{ const [x,y]=pt(i,R); spokes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="'+C.line+'"/>';
    const [lx,ly]=pt(i,R+18); const anc=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
    labels+='<text x="'+lx+'" y="'+(ly+3)+'" font-size="8.5" fill="'+C.muted+'" text-anchor="'+anc+'">'+d.label+'</text>'; });
  const rTgt=R*TARGET/maxV; const tgtPts=drivers.map((_,i)=>pt(i,rTgt).join(',')).join(' ');
  const sPts=drivers.map((d,i)=>pt(i,R*(d.irr==null?0:Math.max(0,d.irr))/maxV).join(',')).join(' ');
  let dots=""; drivers.forEach((d,i)=>{ const [x,y]=pt(i,R*(d.irr==null?0:Math.max(0,d.irr))/maxV); dots+='<circle cx="'+x+'" cy="'+y+'" r="2.5" fill="'+C.primary+'"/>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:400px;height:320px">'+grid+spokes
    +'<polygon points="'+tgtPts+'" fill="none" stroke="'+C.accent+'" stroke-width="1.5" stroke-dasharray="4 3"/>'
    +'<polygon points="'+sPts+'" fill="'+C.primary+'22" stroke="'+C.primary+'" stroke-width="2"/>'+dots+labels+'</svg>';
}
function tornadoSVG(drivers, base){
  drivers = drivers.filter(d=>d.a!=null && d.b!=null).slice().sort((x,y)=>Math.abs(y.a-y.b)-Math.abs(x.a-x.b));
  const n=drivers.length; if(!n) return '';
  const W=400,rowH=26,mT=18,mB=22,mL=96,mR=14, H=mT+mB+n*rowH;
  const all=drivers.flatMap(d=>[d.a,d.b]).concat(base);
  let lo=Math.min(...all),hi=Math.max(...all); const pad=(hi-lo)*0.12||0.02; lo-=pad; hi+=pad;
  const x=v=>mL+(W-mL-mR)*((v-lo)/((hi-lo)||1));
  let grid='',ax='';
  AXT(lo,hi,5).forEach(t=>{ if(t<lo||t>hi) return; const xx=x(t); grid+='<line x1="'+xx.toFixed(1)+'" y1="'+mT+'" x2="'+xx.toFixed(1)+'" y2="'+(H-mB)+'" stroke="'+C.line+'"/>'; ax+='<text x="'+xx.toFixed(1)+'" y="'+(H-mB+12)+'" font-size="8.5" fill="'+C.muted+'" text-anchor="middle">'+(t*100).toFixed(0)+'%</text>'; });
  const xb=x(base);
  let bars='';
  drivers.forEach((d,i)=>{
    const y=mT+i*rowH+4, h=rowH-10, dn=Math.min(d.a,d.b), up=Math.max(d.a,d.b);
    bars+='<rect x="'+x(dn).toFixed(1)+'" y="'+y+'" width="'+Math.max(0.5,xb-x(dn)).toFixed(1)+'" height="'+h+'" fill="'+C.neg+'" opacity="0.85"/>';
    bars+='<rect x="'+xb.toFixed(1)+'" y="'+y+'" width="'+Math.max(0.5,x(up)-xb).toFixed(1)+'" height="'+h+'" fill="'+C.pos+'" opacity="0.85"/>';
    bars+='<text x="'+(mL-6)+'" y="'+(y+h/2+3)+'" font-size="8.5" fill="'+C.muted+'" text-anchor="end">'+d.label+'</text>';
    const tt=tipEsc(d.label+'<br>Downside: '+pct(dn)+'<br>Upside: '+pct(up)+'<br>Swing: '+((up-dn)*100).toFixed(1)+' pts');
    bars+='<rect x="'+x(dn).toFixed(1)+'" y="'+y+'" width="'+Math.max(1,x(up)-x(dn)).toFixed(1)+'" height="'+h+'" fill="#000" fill-opacity="0" pointer-events="all" onmousemove="tip(event,\''+tt+'\')" onmouseout="tipHide()"/>';
  });
  const baseLine='<line x1="'+xb.toFixed(1)+'" y1="'+mT+'" x2="'+xb.toFixed(1)+'" y2="'+(H-mB)+'" stroke="'+C.ink+'" stroke-width="1.5"/>'
    +'<text x="'+xb.toFixed(1)+'" y="'+(mT-5)+'" font-size="8.5" fill="'+C.ink+'" text-anchor="middle">base '+pct(base)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:440px;height:'+H+'px">'+grid+bars+baseLine+ax+'</svg>';
}

/* ---------------- STATEMENT ROWS ---------------- */
function trow(label, vals, o) {

  const tds=vals.map(v=>{const neg=o.sign&&typeof v==="number"&&v<0;const col=o.memo?C.muted:(neg?C.neg:(o.accent?C.primary:C.text));const txt=typeof v==="number"?fmt(v):v;return '<td class="num" style="color:'+col+';font-weight:'+(o.strong?700:400)+(o.memo?';font-style:italic':'')+'">'+txt+'</td>';}).join('');
  if(o.memo) return '<tr><td class="lbl" style="color:'+C.muted+';font-style:italic;font-size:10.5px">'+label+'</td>'+tds+'</tr>';

  return '<tr'+(o.strong?' style="background:'+C.primarySoft+'"':'')+'><td class="lbl" style="background:'+lblbg+';color:'+(o.accent?C.primary:C.text)+';font-weight:'+(o.strong||o.accent?700:400)+'">'+label+'</td>'+tds+'</tr>';

function sTable(title, cols, rows, o) {

  const head=cols.map((c,i)=>'<th class="num" style="color:'+(i===hi?C.accent:C.muted)+';font-weight:'+(i===hi?800:600)+'">'+c+'</th>').join('');

}

/* V11 — two-way sensitivity data table (PF-standard axes) */
function twoWayAxis(key){
  const b={
    capex:{label:"CapEx", fmt:d=>(d>0?"+":"")+d+"%", vals:[-10,-5,0,5,10], patch:d=>({capexMult:1+d/100})},
    opex:{label:"OpEx", fmt:d=>(d>0?"+":"")+d+"%", vals:[-10,-5,0,5,10], patch:d=>({opexMult:1+d/100})},
    tariffCt:{label:"Tariff", fmt:d=>nf1.format(p.tariffCt*(1+d/100)), vals:[-10,-5,0,5,10], patch:d=>({tariffCt:p.tariffCt*(1+d/100)})},
    yield:{label:"Yield", fmt:d=>(d>0?"+":"")+d+"%", vals:[-10,-5,0,5,10], patch:d=>({yield:p.yield*(1+d/100)})},

  };

function twoWayHTML(){
  const AX=[["capex","CapEx"],["opex","OpEx"],["tariffCt","Tariff"],["yield","Yield"],["gearing","Gearing"],["interest","Interest"],["sculptDSCR","Target DSCR"]];
  const MET=[["eqIRR","Equity IRR"],["projIRR","Project IRR"],["minDSCR","Min DSCR"]];
  let rk=state.twoWayRow, ck=state.twoWayCol; if(rk===ck){ ck = (rk==="capex")?"tariffCt":"capex"; }
  const rowAx=twoWayAxis(rk), colAx=twoWayAxis(ck), metric=state.twoWayMetric;
  const sel=(which,cur,opts)=>'<select onchange="setTwoWay(\''+which+'\',this.value)">'+opts.map(([v,l])=>'<option value="'+v+'"'+(cur===v?' selected':'')+'>'+l+'</option>').join('')+'</select>';
  const val=(patch)=>{ const KK=buildModel({...p,...patch}).kpis; return metric==="minDSCR"?KK.minDSCR:(metric==="projIRR"?KK.projIRR:KK.eqIRR); };
  const cell=(v)=>{ if(metric==="minDSCR"){ const st= v==null?{bg:"#EEE",fg:C.muted}:(v>=p.sculptDSCR?{bg:"#E4F2EA",fg:C.pos}:(v>=1.05?{bg:"#FBF0DB",fg:"#8A6D1A"}:{bg:"#F7E4E0",fg:C.neg})); return {text:xd(v),bg:st.bg,fg:st.fg}; } const s=scol(v); return {text:pct(v),bg:s.bg,fg:s.fg}; };
  const head='<th class="num" style="color:'+C.muted+'">'+rowAx.label+' \\ '+colAx.label+'</th>'+colAx.vals.map(cd=>'<th class="num" style="color:'+C.muted+';font-weight:600">'+colAx.fmt(cd)+'</th>').join('');
  const body=rowAx.vals.map(rd=>{
    const cells=colAx.vals.map(cd=>{ const c=cell(val({...rowAx.patch(rd),...colAx.patch(cd)})); return '<td class="num scell" style="color:'+c.fg+';background:'+c.bg+'">'+c.text+'</td>'; }).join('');
    return '<tr><td style="color:'+C.muted+';white-space:nowrap;padding-right:8px;font-weight:600">'+rowAx.fmt(rd)+'</td>'+cells+'</tr>';
  }).join('');
  const ctl='<div class="twoctl"><label>Rows: '+sel("row",rk,AX)+'</label><label>Columns: '+sel("col",ck,AX)+'</label><label>Metric: '+sel("metric",metric,MET)+'</label></div>';
  return '<div class="sblock"><div class="sub" style="color:'+C.ink+'">Two-way sensitivity</div>'+ctl
    + '<div class="xscroll"><table class="stab"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'
    + help("Grid rebuilds the full model at each pair. Centre row/column is the base case. Colour: green &ge; target / target DSCR, amber close, red below.")+'</div>';
}

/* V11 — scenario compare: current (live) + all saved projects, side by side on key KPIs */
function compareHTML(){
  const cols=[{name:((p.name||"Current").trim()||"Current")+" ·live", m:buildModel(p), live:true}];
  savedProjects().forEach(key=>{ try{ const saved=JSON.parse(localStorage.getItem(key)); const merged=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),migrateV22(saved)); cols.push({name:key.slice(6), m:buildModel(merged), pp:merged}); }catch(e){} });
  const cur=(c)=> c.live?p:c.pp;
  const metrics=[
    ["Project IRR", c=>pct(c.m.kpis.projIRR)],
    ["Equity IRR", c=>pct(c.m.kpis.eqIRR)],
    ["Equity IRR (USD)", c=>pct(c.m.kpis.eqIRRusd)],
    ["Min DSCR", c=>xd(c.m.kpis.minDSCR)],
    ["Avg DSCR", c=>xd(c.m.kpis.avgDSCR)],
    ["LLCR", c=>xd(c.m.kpis.llcr)],
    ["PLCR", c=>xd(c.m.kpis.plcr)],
    ["Gearing (achieved)", c=>c.m.totalFunding>0?nf1.format(c.m.debt/c.m.totalFunding*100)+"%":"n/a"],
    ["Debt tenor", c=>c.m.tenor+" y"],
    ["Tariff (ct/kWh)", c=>nf1.format(cur(c).tariffCt)],
    ["LCOE offtaker (ct/kWh)", c=>nf1.format(c.m.kpis.lcoeOfftaker/10)],
    ["NPV project (M)", c=>M(c.m.kpis.npvProj)],
    ["Equity (M)", c=>M(c.m.equityTotal)],
  ];
  const head=cols.map((c,i)=>'<th class="num" style="color:'+(c.live?C.primary:C.muted)+';font-weight:'+(c.live?800:600)+'">'+esc(c.name)+'</th>').join('');
  const body=metrics.map(mm=>'<tr><td style="color:'+C.muted+';white-space:nowrap;padding-right:8px">'+mm[0]+'</td>'
    + cols.map(c=>'<td class="num" style="color:'+C.text+'">'+mm[1](c)+'</td>').join('')+'</tr>').join('');
  const note = cols.length<2 ? help("Save scenarios (Save button, top-left) to compare them here side by side with the live case.") : help("The live column is the current inputs; the others are your saved projects. Save the current case first to freeze it as a column.");
  return '<div class="pad"><div class="sblock"><div class="sub" style="color:'+C.ink+'">Scenario comparison</div>'+note
    + '<div class="xscroll"><table class="stab"><thead><tr><th></th>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div></div></div>';
}

function resultsHTML() {
  const m=buildModel(p), S=computeSensi(p), R=m.rows, K=m.kpis;
  const usd=p.ccy!=="USD";
  const TEN=m.tenor;
  const effGearing = m.totalFunding>0 ? (m.debt/m.totalFunding*100) : 0;   // #6 — achieved gearing after sculpting
  let out="";
  const warn=[];
  if (p.gearing>100||p.gearing<0) warn.push(["err","Gearing must be between 0 and 100%."]);
  if (TEN>p.projectLife) warn.push(["warn","Debt tenor ("+TEN+"y) exceeds the operating life ("+p.projectLife+"y)."]);
  if (K.eqIRR==null) warn.push(["err","Equity IRR not computable - shareholder cash flows never turn positive."]);
  else if (K.eqIRR<0) warn.push(["warn","Equity IRR is negative at these assumptions."]);
  if (K.minDSCR!=null && K.minDSCR<1) warn.push(["err","Minimum DSCR "+xd(K.minDSCR)+" (<1x) - debt service not fully covered in at least one year."]);
  else if (K.minDSCR!=null && K.minDSCR<1.05) warn.push(["warn","Minimum DSCR is thin ("+xd(K.minDSCR)+")."]);
  if (p.repay==="sculpt" && m.bindGearing===false) warn.push(["warn","Debt is DSCR-constrained: sized down to hold "+nf1.format(p.sculptDSCR)+"x on P90 — the gearing cap ("+p.gearing+"%) is not reached. Sculpted (achieved) gearing: <b>"+nf1.format(effGearing)+"%</b>."]);
  if (p.tech==="pv_bess" && p.bessMWh>0) { const minS=Math.min(...R.map(x=>x.bessSoh)); if (minS<0.8) { const y=R.find(x=>x.bessSoh===minS); warn.push(["warn","BESS usable capacity falls to "+nf1.format(minS*100)+"% of contracted (Y"+y.year+")"+(p.bessFeeOnAvail?" — the capacity fee drops accordingly":"")+". Consider augmentation or a replacement (CapEx &rarr; Re-CapEx)."]); } }

  if (p.leasingOn && p.tariffCt>0 && p.leasingAnnual>0) warn.push(["warn","Both an energy tariff and a lease payment are active — check this matches the PPA structure."]);
  if (warn.length) out += '<div class="warnbox">'+warn.map(w=>'<div class="wrow '+(w[0]==="err"?"we":"ww")+'"><b>'+(w[0]==="err"?"!":"?")+'</b> '+w[1]+'</div>').join('')+'</div>';

  out += '<div class="card chartcard"><div class="boxt">Coverage ratios — DSCR · LLCR · PLCR</div>'+coverageChart(R)
    + legend([["DSCR (bars)",C.primary],["LLCR",C.ink],["PLCR (dashed, ▲ = above scale)",C.accent]])+'</div>';
  out += '<div class="card chartcard"><div class="boxt">Shareholder cash flow (k'+p.ccy+') &amp; DSCR'
    + '<button class="tbtn" style="float:right;font-size:10px;padding:2px 7px" onclick="toggleCumul()">'+(state.hideCumul?"Show cumulative":"Hide cumulative")+'</button></div>'
    + chartSVG(R,m.equityCash-m.successFee+m.priEqConstr,state.hideCumul)
    + legend(state.hideCumul?[["Annual flow",C.primary],["DSCR (right)",C.neg]]:[["Annual flow",C.primary],["Cumulative",C.ink],["DSCR (right)",C.neg]])+'</div>';
  out += '</div>';
  // output tabs
  const OT=[["pnl","Income statement"],["cf","Cash flow & waterfall"],["bs","Balance sheet"],["prod","Production & revenue"],["sensi","Sensitivities"],["compare","Scenario compare"],["ic","Committee 1-pager"]];
  out += '<div class="card"><div class="otabs">'+OT.map(([id,l])=>'<button class="otab'+(state.otab===id?" on":"")+'" onclick="setOtab(\''+id+'\')">'+l+'</button>').join('')+'</div>';

  if (state.otab==="pnl"||state.otab==="cf"||state.otab==="bs"||state.otab==="prod") {
    const yh=((state.otab==="cf"||state.otab==="bs")?'<th class="num">'+(state.otab==="bs"?"FC":"C")+'</th>':"")+R.map(x=>'<th class="num">Y'+x.year+'</th>').join('');
    let body="";
    if (state.otab==="pnl") {
      body += trow("Revenue",R.map(x=>x.revenue),{accent:1})+trow("OpEx",R.map(x=>-x.opex),{sign:1})+trow("EBITDA",R.map(x=>x.ebitda),{strong:1})
        + trow("Recurring fees (acct/LC/agency"+(p.priDebtOn?"/PRI":"")+")",R.map(x=>-x.recurFees),{sign:1})+trow("Depreciation",R.map(x=>-x.deprec),{sign:1})
        + trow("EBIT",R.map(x=>x.ebit),{strong:1,sign:1})
        + trow(m.refiYears&&m.refiYears.length?"Fin. fee amort. / write-off":"Fin. fee amort.",R.map(x=>-x.feeAmort),{sign:1})+trow("Senior interest",R.map(x=>-x.interest),{sign:1})+trow("SHL interest",R.map(x=>-x.shlInterest),{sign:1})
        + (R.some(x=>x.whtIntCost>0.5)?trow("WHT on senior interest (gross-up)",R.map(x=>-x.whtIntCost),{sign:1}):"")
        + (R.some(x=>x.vatFacInt>0.5)?trow("VAT facility interest",R.map(x=>-x.vatFacInt),{sign:1}):"")
        + (R.some(x=>x.refiCost>0.5)?trow("Refinancing costs (fees, breakage)",R.map(x=>-x.refiCost),{sign:1}):"")
        + (R.some(x=>x.vatWO>0.5)?trow("VAT credit written off (unrecovered)",R.map(x=>-x.vatWO),{sign:1}):"")
        + trow("EBT (pre-tax)",R.map(x=>x.ebt),{strong:1,sign:1})+trow("Income tax",R.map(x=>-x.tax),{sign:1})+trow("Other taxes",R.map(x=>-x.otherTax),{sign:1})+trow("Net income",R.map(x=>x.netIncome),{strong:1,sign:1});
    } else if (state.otab==="cf") {
      const Z=R.map(()=>0), any=(f)=>R.some(x=>Math.abs(f(x)||0)>0.5);
      const vatOn=m.vatInput>0, facOn=m.vatFac0>0;
      body += sec("Funding at financial close")
        + trow("Senior debt drawdown",[m.debt,...Z],{})
        + (facOn?trow("VAT facility drawdown",[m.vatFac0,...Z],{}):"")
        + trow("Equity injection — cash (share capital + SHL)",[m.equityCash,...Z],{})
        + ((p.grantOn&&p.grantType==="pure"&&m.grant>0)?trow("Grant (non-repayable)",[m.grant,...Z],{}):"")
        + trow("Hard CapEx",[-m.hardCapex,...Z],{sign:1})
        + (vatOn?trow("VAT on CapEx (input VAT paid)",[-m.vatInput,...Z],{sign:1}):"")
        + ((p.grantOn&&p.grantType==="reimbursable"&&m.grantUse>0)?trow("SEFA reimbursement (dev, at FC)",[-m.grantUse,...Z],{sign:1}):"")
        + trow("Financing fees, IDC, bank fees & reserves (cash)",[-(m.idc+m.upfront+m.commitment+m.bankFeesC+m.dsraFunded+p.minReserve+m.vatFacIDC+m.priDC),...Z],{sign:1})
        + (m.wcCap>0?trow("Initial working capital (funded reserve)",[-m.wcCap,...Z],{sign:1}):"")
        + trow("Success fee to sponsor (COD)",[-m.successFee,...Z],{sign:1})
        + sec("Operations")
        + trow("EBITDA",[0,...R.map(x=>x.ebitda)],{strong:1})
        + trow("Recurring fees (acct/LC/agency"+(p.priDebtOn?"/debt PRI":"")+")",[0,...R.map(x=>-x.recurFees)],{sign:1})
        + trow("Cash tax (unlevered, CFADS basis)",[0,...R.map(x=>-x.taxU)],{sign:1})
        + (p.wcOn?trow("Δ Working capital",[0,...R.map(x=>-(x.dNWC||0))],{sign:1}):"")
        + trow("CFADS",[0,...R.map(x=>x.cfads)],{accent:1})
        + trow("Senior debt service",[0,...R.map(x=>-x.seniorDS)],{sign:1})
        + trow("DSCR",["—",...R.map(x=>x.dscr==null?"—":x.dscr)],{fmt:xd,strong:1})
        + trow("LLCR",["—",...R.map(x=>x.llcr==null?"—":x.llcr)],{fmt:xd})
        + trow("PLCR",["—",...R.map(x=>x.plcr==null?"—":x.plcr)],{fmt:xd})
        + trow("Tax adj. (levered − unlevered) & other taxes",[0,...R.map(x=>-x.taxAdj)],{sign:1})
        + (any(x=>x.whtIntCost)?trow("WHT on senior interest (gross-up)",[0,...R.map(x=>-x.whtIntCost)],{sign:1}):"")
        + (any(x=>x.recapex)?trow("Re-capex (PV / BESS / augmentation)",[0,...R.map(x=>-x.recapex)],{sign:1}):"")
        + trow("MRA provision",[0,...R.map(x=>-x.mraContribution)],{sign:1})
        + (any(x=>x.mraDraw)?trow("MRA release (funds re-capex)",[0,...R.map(x=>x.mraDraw)],{sign:1}):"")
        + trow("DSRA movement",[0,...R.map(x=>-x.dDSRAcash)],{sign:1})
        + (vatOn?trow("VAT recovered ("+(m.vatRecMode==="offset"?"offset vs output VAT":"refund")+")",[0,...R.map(x=>x.vatRec)],{sign:1}):"")
        + ((vatOn&&m.vatRecMode==="offset")?trow("memo: VAT collected on sales",["",...R.map(x=>x.vatOut)],{memo:1})+trow("memo: VAT paid on OpEx",["",...R.map(x=>-x.vatInOpex)],{memo:1})+trow("memo: remaining VAT credit (end of year)",[m.bs0.vatRecv,...R.map(x=>x.bs.vatRecv)],{memo:1}):"")
        + (facOn?trow("VAT facility interest",[0,...R.map(x=>-x.vatFacInt)],{sign:1})+trow("VAT facility repayment",[0,...R.map(x=>-x.vatFacRepay)],{sign:1}):"")
        + (any(x=>x.refiNew)?trow("Refinancing — new loan",[0,...R.map(x=>x.refiNew)],{sign:1})+trow("Refinancing — old debt repaid",[0,...R.map(x=>-x.refiRepaid)],{sign:1})+trow("Refinancing — costs",[0,...R.map(x=>-x.refiCost)],{sign:1}):"")
        + trow("Net cash generated (for distribution)",[0,...R.map(x=>x.distCash)],{strong:1})
        + sec("Shareholder waterfall")
        + trow("· SHL interest",[0,...R.map(x=>-x.shlIntPay)],{sign:1})
        + trow("· SHL principal",[0,...R.map(x=>-x.shlPrinPay)],{sign:1})
        + trow("· Dividends",[0,...R.map(x=>-x.dividends)],{sign:1})
        + trow("Operating cash balance (end of year)",["—",...R.map(x=>x.opCashEnd)],{sign:1})
        + sec("Shareholder cash flow (AEG)")
        + trow("Equity injected (cash)",[-m.equityCash,...Z],{sign:1})
        + trow("Success dev fee received (COD)",[m.successFee,...Z],{sign:1})
        + ((m.priEqConstr>0||any(x=>x.priEq))?trow("Equity PRI premium (sponsor)",[-m.priEqConstr,...R.map(x=>-x.priEq)],{sign:1}):"")
        + trow("SHL interest + principal + dividends",[0,...R.map(x=>x.shlIntPay+x.shlPrinPay+x.dividends)],{sign:1})
        + (any(x=>x.whtDist)?trow("less WHT on SHL interest & dividends",[0,...R.map(x=>-x.whtDist)],{sign:1}):"")
        + trow("Reserves & residual cash released (end)",[0,...R.map(x=>x.reserveRelease)],{sign:1})
        + trow("Shareholder cash flow (AEG)",[-m.equityCash+m.successFee-m.priEqConstr,...R.map(x=>x.aegFCF)],{strong:1,sign:1});
    } else if (state.otab==="bs") {
      const B=[m.bs0,...R.map(x=>x.bs)], row=(l,f,o)=>trow(l,B.map(f),o||{sign:1});
      const nz=(f)=>B.some(b=>Math.abs(f(b))>0.5);
      body += sec("Assets")
        + row("Fixed assets, net (PP&E)",b=>b.nbv)
        + (nz(b=>b.defFee)?row("Deferred financing costs",b=>b.defFee):"")
        + (nz(b=>b.vatRecv)?row("VAT receivable",b=>b.vatRecv):"")
        + (nz(b=>b.ar)?row("Trade receivables",b=>b.ar):"")
        + (nz(b=>b.dsra)?row("Cash — DSRA",b=>b.dsra):"")
        + (nz(b=>b.mra)?row("Cash — MRA",b=>b.mra):"")
        + (nz(b=>b.minRes)?row("Cash — minimum reserve",b=>b.minRes):"")
        + (nz(b=>b.wcRes)?row("Cash — working-capital reserve",b=>b.wcRes):"")
        + row("Cash — operating (incl. trapped)",b=>b.cash)
        + row("Total assets",b=>b.assets,{strong:1,sign:1})
        + sec("Liabilities")
        + row("Senior debt",b=>b.debt)
        + (nz(b=>b.vatFac)?row("VAT facility",b=>b.vatFac):"")
        + row("Shareholder loan (incl. capitalised interest)",b=>b.shl)
        + (nz(b=>b.ap)?row("Trade payables",b=>b.ap):"")
        + row("Total liabilities",b=>b.liab,{strong:1,sign:1})
        + sec("Equity")
        + row("Share capital",b=>b.shareCap)
        + row("Retained earnings (net income − dividends)",b=>b.re)
        + (nz(b=>b.ret)?row("Capital & reserves returned (end)",b=>b.ret):"")
        + row("Total equity",b=>b.equity,{strong:1,sign:1})
        + row("Total liabilities & equity",b=>b.liab+b.equity,{strong:1,sign:1})
        + trow("Balance check (assets − L&E)",B.map(b=>Math.abs(b.check)<1?"✓ 0":k(b.check)),{fmt:v=>v});
    } else {
      const nf0=(v)=>nf.format(v);
      body += trow("Gross PV output (MWh)",R.map(x=>x.pvGross),{fmt:nf0})+trow("BESS discharge (MWh)",R.map(x=>x.discharge),{fmt:nf0})
        + trow("Availability losses — plant + grid (MWh)",R.map(x=>-(x.availLoss||0)),{fmt:nf0,sign:1})
        + trow("Curtailment (MWh)",R.map(x=>-x.curtailLoss),{fmt:nf0,sign:1})+trow("Billed energy (MWh)",R.map(x=>x.energySold),{fmt:nf0,accent:1})
        + (p.tech==="pv_bess"?trow("BESS usable capacity (MWh)",R.map(x=>x.bessCap),{fmt:v=>nf1.format(v)})+trow("BESS state of health (% contracted)",R.map(x=>x.bessSoh*100),{fmt:v=>nf1.format(v)+"%"})+(!p.prodManual?trow("BESS round-trip efficiency",R.map(x=>x.bessRte*100),{fmt:v=>nf1.format(v)+"%"}):""):"")
        + trow("Energy tariff (ct/kWh)",R.map(x=>x.tariff),{fmt:v=>nf2.format(v)})
        + (p.leasingOn?trow("Lease payment",R.map(x=>x.leaseFee)):"")
        + trow("Energy revenue",R.map(x=>x.revEnergy))+(p.leasingOn?trow("Leasing revenue",R.map(x=>x.revLeasing)):"")+trow("BESS fee",R.map(x=>x.revBess))+trow("Carbon (net)",R.map(x=>x.revCarbon))+trow("Total revenue",R.map(x=>x.revenue),{strong:1});
    }
    out += '<div class="xscroll"><table class="stmt"><thead><tr><th class="lbl">k'+p.ccy+'</th>'+yh+'</tr></thead><tbody>'+body+'</tbody></table></div>';
    if (state.otab==="pnl") out += help(p.depMethod==="db"
      ? 'Depreciation shown is <b>accounting D&amp;A</b> (straight-line over '+Math.round(p.bookLife||p.deprecYears)+' yrs). Income tax is <b>cash tax</b> on the <b>declining / accelerated</b> fiscal base, so it will not equal book EBT &times; CIT — the gap is a timing difference carried through the loss carryforward.'
      : 'Depreciation is <b>straight-line</b> over '+Math.round(p.bookLife||p.deprecYears)+' yrs and drives both the P&amp;L and the tax base. Income tax shown is <b>cash tax</b>; it can still differ from book EBT &times; CIT because of the tax holiday, loss carryforward and any minimum tax.');
    if (state.otab==="bs") out += help('Balance sheet at financial close (FC) and at each year end. Fixed assets = hard CapEx + success fee + IDC'+(m.vatLost>0?' + non-recoverable VAT':'')+' (net of any pure grant) plus re-capex, less accounting D&amp;A; re-capex is depreciated over the remaining life. Financing fees are carried as deferred costs and amortised over the tenor. Taxes are cash taxes (no deferred tax). The check line must read ✓ 0 every year.');
    if (state.otab==="cf") { const of=(p.opCashMin||0); out += help('Shareholder distributions (SHL interest, SHL principal, then dividends) are all gated by the DSCR/LLCR lock-up and paid only from cash above the operating floor'+(of>0?" ("+k(of)+"k)":"")+'. Unpaid SHL interest capitalises; trapped cash is retained and released when covenants clear or at project end. The <b>success dev fee</b> ('+k(m.successFee)+'k) is funded within the raise (a use above, so Sources = Uses) and <b>returned to the sponsor at COD</b> (the positive line at the bottom) — a single flow that lifts the equity IRR via the shareholder cash flow at COD (&minus;equity + success fee), with no effect on the project IRR.'); }
  } else if (state.otab==="sensi") {
    out += '<div class="pad">';
    out += twoWayHTML();
    out += help('One-way tables below — cells show Equity IRR vs the base target of '+pct(TARGET)+'. <b style="color:'+C.pos+'">Green</b> &ge; target, <b style="color:#8A6D1A">amber</b> within 2 pts, <b style="color:'+C.neg+'">red</b> below.');
    const cc=(irr)=>{const s=scol(irr);return {text:pct(irr),bg:s.bg,fg:s.fg};};
    out += sTable("CapEx variation → Equity IRR", S.capex.map(x=>x.d===0?"Base":(x.d>0?"+":"")+x.d+"%"), [{label:"Equity IRR",cells:S.capex.map(x=>cc(x.irr))}]);
    out += sTable("OpEx variation → Equity IRR", S.opex.map(x=>x.d===0?"Base":(x.d>0?"+":"")+x.d+"%"), [{label:"Equity IRR",cells:S.opex.map(x=>cc(x.irr))}]);
    out += sTable("Gearing → Equity IRR", S.gearing.map(x=>x.g+"%"), [{label:"Equity IRR",cells:S.gearing.map(x=>cc(x.irr))}], {highlight:S.gearing.findIndex(x=>x.g===Math.round(p.gearing))});
    out += sTable("Debt rate → Equity IRR", S.rate.map(x=>nf1.format(x.i)+"%"), [{label:"Equity IRR",cells:S.rate.map(x=>cc(x.irr))}], {highlight:S.rate.findIndex(x=>Math.abs(x.d)<1e-9), note:"Central rate = current all-in rate ("+nf1.format(p.interest)+"%), ±2% in 0.5% steps."});
    out += sTable("PV tariff (ct"+p.ccy+"/kWh) → IRR", S.pvTar.map(x=>nf1.format(x.tc)), [{label:"Equity IRR",cells:S.pvTar.map(x=>cc(x.eq))},{label:"Project IRR",cells:S.pvTar.map(x=>({text:pct(x.proj)}))}], {highlight:3});
    if (S.leasing) out += sTable("Leasing price → Equity IRR", S.leasing.map(x=>x.d===0?"Base":(x.d>0?"+":"")+x.d+"%"), [{label:"Equity IRR",cells:S.leasing.map(x=>cc(x.irr))}], {highlight:3, note:"Lease payment varied around the base "+nf.format(p.leasingAnnual)+" "+p.revCcy+"/yr."});
    out += sTable("Tariff required for target Equity IRR", S.tarForTarget.map(x=>x.t+"%"),
      [{label:"Required tariff (ct"+p.ccy+")",cells:S.tarForTarget.map(x=>({text:nf1.format(x.tariff)}))}],
      {highlight:S.tarForTarget.findIndex(x=>x.t===15), note:"Solves the tariff that delivers each target equity IRR (all else equal). 15% = base target."});
    // multi-criteria: radar (resilience) + tornado (ranked swings), side by side
    const irrOf=(o)=>buildModel({...p,...o}).kpis.eqIRR;
    const drv=[
     {label:"CapEx +10%",irr:irrOf({capexMult:1.1})},
     {label:"OpEx +10%",irr:irrOf({opexMult:1.1})},
     {label:"Tariff −5%",irr:irrOf({tariffCt:p.tariffCt*0.95})},
     {label:"Yield −5%",irr:irrOf({yield:p.yield*0.95})},
     {label:"Interest +1pt",irr:irrOf({interest:p.interest+1})},
     {label:"Gearing −5pt",irr:irrOf({gearing:Math.max(0,p.gearing-5)})},
     {label:"Curtail +3pt",irr:irrOf({curtailment:p.curtailment+3})},
    ];
    const tdrv=[
     {label:"CapEx ±10%", a:irrOf({capexMult:0.9}), b:irrOf({capexMult:1.1})},
     {label:"OpEx ±10%", a:irrOf({opexMult:0.9}), b:irrOf({opexMult:1.1})},
     {label:"Tariff ±5%", a:irrOf({tariffCt:p.tariffCt*1.05}), b:irrOf({tariffCt:p.tariffCt*0.95})},
     {label:"Yield ±5%", a:irrOf({yield:p.yield*1.05}), b:irrOf({yield:p.yield*0.95})},
     {label:"Interest ±1pt", a:irrOf({interest:Math.max(0,p.interest-1)}), b:irrOf({interest:p.interest+1})},
     {label:"Gearing ±5pt", a:irrOf({gearing:Math.min(100,p.gearing+5)}), b:irrOf({gearing:Math.max(0,p.gearing-5)})},
     {label:"Curtail ±3pt", a:irrOf({curtailment:Math.max(0,p.curtailment-3)}), b:irrOf({curtailment:p.curtailment+3})},
    ];
    if (p.leasingOn && p.leasingAnnual>0) tdrv.push({label:"Leasing ±10%", a:irrOf({leasingAnnual:p.leasingAnnual*1.1}), b:irrOf({leasingAnnual:p.leasingAnnual*0.9})});
    out += '<div class="sblock"><div class="sub" style="color:'+C.ink+'">Multi-criteria stress on Equity IRR</div>'
      + help("Radar (left) shows resilience per driver — points near the centre are the most sensitive. Tornado (right) ranks drivers by their swing on equity IRR, widest at top. Black line = base "+pct(K.eqIRR)+".")
      + '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:center">'
      + '<div style="flex:1 1 300px;min-width:280px;text-align:center">'+radarSVG(drv,K.eqIRR||0)+legend([["Stressed IRR",C.primary],["Target "+pct(TARGET),C.accent]])+'</div>'
      + '<div style="flex:1 1 320px;min-width:300px">'+tornadoSVG(tdrv,K.eqIRR||0)+legend([["Downside",C.neg],["Upside",C.pos]])+'</div>'
      + '</div></div>';
    out += '</div>';
  } else if (state.otab==="compare") {
    out += compareHTML();
  } else if (state.otab==="ic") {
    out += onePagerHTML(m, S, K, effGearing);
  }
  out += '</div>';
  out += help("Annual-step pre-screen: financing close (debt ← IDC + fees + DSRA + min reserve), debt sized as min(gearing cap, DSCR-sculpting capacity) with sculpting always on the P90 case — the shown scenario then displays the DSCR cushion above the flat P90 profile. Payment frequency sets the interest convention, MRA provisioned over the funding window, distribution waterfall (SHL then dividends) gated by a DSCR/LLCR lock-up, VAT on CapEx in the funding plan with refund / offset recovery, re-capex capitalised, balance sheet checked every year, no terminal value (BOOT). Single-currency tariff and debt. USD IRR via FX depreciation only. For bankability (exact semi-annual sculpting, deferred tax) move to the full PF model.");
  // header tags
  const ht=document.getElementById("htags");
  if (ht) ht.innerHTML=[p.tech==="pv_bess"?"PV + BESS":"PV only",{sculpt:"Sculpted debt",annuity:"Annuity",linear:"Linear"}[p.repay],p.dsraMode==="lc"?"DSRA via LC":"Cash DSRA",...(p.refiOn?["Refinancing"]:[]),...((p.priDebtOn||p.priEqOn)?["PRI"]:[]),p.ccy].map(t=>'<span class="tag">'+t+'</span>').join('');
  return out;
}
const sec=(t)=>'<tr class="secrow"><td class="lbl">'+t+'</td><td colspan="99"></td></tr>';
const su=(l,v,t)=>'<div class="surow'+(t?' sut':'')+'"><span>'+l+'</span><b>'+v+'</b></div>';
const legend=(items)=>'<div class="legend">'+items.map(x=>'<span><i style="background:'+x[1]+'"></i>'+x[0]+'</span>').join('')+'</div>';

  const ch=document.getElementById("prodChart"); if(ch) ch.innerHTML=prodChartHTML(p);

function updateDerived(){
  const ac=document.getElementById("acDerived"); if(ac) ac.textContent=nf1.format(p.pvMW/(p.dcac||1))+" MWac";
  const tn=document.getElementById("tenorDerived"); if(tn) tn.textContent=effTenor(p)+" yrs";
  const sh=document.getElementById("shlDerived"); if(sh) sh.textContent=nf1.format(effShlRate(p))+" %";
  const pe=document.getElementById("pvEpcDerived"); if(pe) pe.textContent=(p.pvMW>0? nf2.format(p.pvEpcLump/(p.pvMW*1e6)) : "n/a")+" "+p.capexCcy+"/Wp";
  const be=document.getElementById("bessEpcDerived"); if(be) be.textContent=(p.bessMWh>0? nf.format(p.bessEpcLump/(p.bessMWh*1000)) : "n/a")+" "+p.capexCcy+"/kWh";
  const wd=document.getElementById("wcCapDerived"); if(wd) wd.textContent=k(buildModel(p).wcCap)+"k "+p.ccy;

        if(cfg.tracking==="fixed"){pp=poaFixed(ghiH[i],dni,dhiH[i],dniX,zen[i],saz[i],cfg.tilt,cfg.azimuth,albedo);}
        else{var rot=trackerRot(zen[i],saz[i],cfg.tilt,cfg.maxAngle,cfg.backtrack,cfg.gcr); pp=poaTracker(ghiH[i],dni,dhiH[i],dniX,zen[i],saz[i],rot,albedo);}
        if(cosz[i]<=0)pp=0; poaH.push(pp); poaDaySum+=pp*dt;
      }
      poaMonth.push(poaDaySum*DIM[m]/1000); hourly.push({poa:poaH,tamb:res.tamb[m],wind:wind});
    }
    return {poaMonth:poaMonth,hourly:hourly};
  }
  function tempLoss(poaH,tamb,wind,gamma,uc,uv,shape){
    var sum=0,tot=0; for(var i=0;i<poaH.length;i++){var tc=tamb+poaH[i]/Math.max(uc+uv*wind,1e-3); sum+=poaH[i]*tc; tot+=poaH[i];}
    if(tot<=0)return 0; var tcEff=sum/tot; return gamma*((tcEff-tamb)*shape+(tamb-25.0));
  }
  function bifacialGain(albedo,gcr,bif,rearSh,rearMm,hr){ if(bif<=0)return {gain:0,rearFrac:0}; var VF=0.48*((1-gcr)/(1-0.373))*(0.6+0.4*hr)/0.96; var rf=albedo*VF*(1-rearSh); return {gain:rf*bif*(1-rearMm),rearFrac:rf}; }
  function clipFromILR(ilr){return ilr<=1?0:Math.min(0.044*Math.pow(ilr-1,1.15),0.06);}
  function gridLineLoss(km,kv){return km<=0?0:Math.min(0.006*km*Math.pow(33.0/kv,2)*0.5,0.05);}
  var LOSSES={farShading:0.004,nearShading:0.022,soiling:0.025,iam:0.001,irradianceLevel:-0.001,elecShading:0.002,moduleQuality:-0.002,lid:0.010,mismatch:0.010,rearMismatchExtra:0.005,dcOhmic:0.008,inverterEff:0.013,inverterClip:0.014,aux:0.005,acOhmic:0.009,mvTransfo:0.011,mvLine:0.001,hvTransfo:0.010,hvLine:0.000,availability:0.015,degradationY1:0.002};
  function irrF(L){return (1-L.farShading)*(1-L.nearShading)*(1-L.soiling)*(1-L.iam);}
  function dcF(L){return (1-L.irradianceLevel)*(1-L.elecShading)*(1-L.moduleQuality)*(1-L.lid)*(1-L.mismatch)*(1-L.rearMismatchExtra)*(1-L.dcOhmic);}
  function acF(L){return (1-L.inverterEff)*(1-L.inverterClip)*(1-L.aux)*(1-L.acOhmic)*(1-L.mvTransfo)*(1-L.mvLine)*(1-L.hvTransfo)*(1-L.hvLine);}
  var ZM={P50:0,P75:0.6745,P90:1.2816,P95:1.6449,P99:2.3263};
  function estimate(res,opt){
    var L=opt.losses||LOSSES, cfg=opt.array, poa=computePOA(res,cfg);
    var poaYear=poa.poaMonth.reduce(function(a,b){return a+b;},0);
    var ghiYear=res.ghi.reduce(function(a,b){return a+b;},0);
    var poaEff=poaYear*irrF(L), albAvg=res.albedo.reduce(function(a,b){return a+b;},0)/12;
    var bg=bifacialGain(albAvg,cfg.gcr,opt.module.bifaciality,0.05,L.rearMismatchExtra*2,0.9);
    var yNom=poaEff*(1+bg.gain), tNum=0,tDen=0;
    for(var m=0;m<12;m++){var lo=tempLoss(poa.hourly[m].poa,poa.hourly[m].tamb,poa.hourly[m].wind,opt.module.gamma,opt.uc,opt.uv,opt.shape||0.88); var w=poa.hourly[m].poa.reduce(function(a,b){return a+b;},0); tNum+=lo*w; tDen+=w;}
    var tempL=tDen>0?tNum/tDen:0, yDc=yNom*(1+tempL)*dcF(L);
    var Lclip=clipFromILR(opt.ilr), yAc=yDc*(acF(L)/(1-L.inverterClip)*(1-Lclip));
    var FLEET_CAL=0.987; // calibration flotte: centré sur 9 rapports PVsyst Axian (MAE 0.8%)
    var gLoss=gridLineLoss(opt.gridKm||0,opt.gridKv||33), yBus=yAc*(1-gLoss)*FLEET_CAL;
    // V22 — the estimator now returns yield AT 100% AVAILABILITY and BEFORE first-year degradation (PVsyst "specific
    //        production" basis, which is what the fleet calibration targets). Availability (plant + grid) and degradation
    //        are applied once, in the financial model — previously 1.5% availability + 0.2% LID were netted here AND the
    //        model applied its own degradation, i.e. a small double count.
    var yGross=yBus, yNet=yBus;
    var u=opt.unc||{meas:0.04,iav:0.0146,model:0.02,soft:0.02};
    var sigma=Math.sqrt(u.meas*u.meas+u.iav*u.iav+u.model*u.model+u.soft*u.soft);
    var pct={},prod={}; for(var kk in ZM){pct[kk]=yNet*(1-ZM[kk]*sigma); prod[kk]=pct[kk]*opt.dcMWp/1000;}
    return {ghiYear:ghiYear,poaYear:poaYear,transposition:poaYear/ghiYear,bifacialGain:bg.gain,tempLoss:tempL,clipLoss:Lclip,gridLoss:gLoss,specificYieldGross:yGross,PRgross:yGross/poaYear,specificYieldNet:yNet,sigma:sigma,specificYieldPct:pct,productionGWhPct:prod,poaMonth:poa.poaMonth};
  }
  // -- variante moteur-NREL : specific yield fourni par PVWatts, on applique σ --
  function fromSpecific(syNet, dcMWp, unc){
    var u=unc||{meas:0.04,iav:0.0146,model:0.02,soft:0.02};
    var sigma=Math.sqrt(u.meas*u.meas+u.iav*u.iav+u.model*u.model+u.soft*u.soft);
    var pct={},prod={}; for(var kk in ZM){pct[kk]=syNet*(1-ZM[kk]*sigma); prod[kk]=pct[kk]*dcMWp/1000;}
    return {specificYieldNet:syNet,sigma:sigma,specificYieldPct:pct,productionGWhPct:prod};
  }
  return {estimate:estimate,fromSpecific:fromSpecific,LOSSES:LOSSES};
})();

/* ---- base modules (fiche technique) ---- */
var YMODULES={
  JinkoJKM640N:{label:"Jinko Tiger Neo JKM640N (640W, N-TOPCon, bifacial)",pmax:640,area:2.701,gamma:-0.0029,bifaciality:0.82},
  LONGiHiMO7_620:{label:"LONGi Hi-MO 7 620W (N-TOPCon, bifacial)",pmax:620,area:2.585,gamma:-0.0028,bifaciality:0.80},
  TrinaVertexN_720:{label:"Trina Vertex N 720W (N-TOPCon, bifacial)",pmax:720,area:3.11,gamma:-0.0030,bifaciality:0.80},
  JinkoTigerPro_550:{label:"Jinko Tiger Pro 550W (p-PERC, bifacial)",pmax:550,area:2.585,gamma:-0.0035,bifaciality:0.70},
  GenericMono_550:{label:"Generic mono-PERC 550W (monofacial)",pmax:550,area:2.585,gamma:-0.0035,bifaciality:0.0}
};

/* ---- fetchers ressource (compatibles navigateur / CORS) ---- */
function ym_parse12(str){ var a=String(str||"").split(/[^0-9.\-]+/).map(function(x){return parseFloat(x);}).filter(function(x){return isFinite(x);}); return a; }
async function fetchNASA(lat,lon){
  var url="https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=ALLSKY_SFC_SW_DWN,ALLSKY_SFC_SW_DIFF,T2M,WS10M,ALLSKY_SRF_ALB&community=RE&longitude="+lon+"&latitude="+lat+"&format=JSON";
  var j=await ym_json(url,"NASA POWER"), P=j.properties.parameter, MK=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  var ghi=[],dhi=[],tamb=[],wind=[],alb=[], albOK=!!P.ALLSKY_SRF_ALB, albFallback=(+p.yAlbedo)||0.18;
  for(var i=0;i<12;i++){ ghi.push(P.ALLSKY_SFC_SW_DWN[MK[i]]*DIM_[i]); dhi.push(P.ALLSKY_SFC_SW_DIFF[MK[i]]*DIM_[i]); tamb.push(P.T2M[MK[i]]); wind.push(P.WS10M[MK[i]]);
    var a=albOK?P.ALLSKY_SRF_ALB[MK[i]]:null; alb.push((a!=null&&a>0.02&&a<0.95)?a:albFallback); }
  return {lat:+lat,lon:+lon,ghi:ghi,dhi:dhi,tamb:tamb,wind:wind,albedo:alb,source:"NASA POWER"+(albOK?" (albedo from NASA)":"")};
}
var DIM_=[31,28,31,30,31,30,31,31,30,31,30,31];
async function fetchNREL(lat,lon,opt,key){
  var atype = opt.tracking==="fixed"?0:3; // 0 fixe open-rack, 3 mono-axe backtracking
  var base=["https://developer.nrel.gov"];
  var q="/api/pvwatts/v8.json?api_key="+encodeURIComponent(key||"DEMO_KEY")
    +"&lat="+lat+"&lon="+lon+"&system_capacity="+(opt.dcMWp*1000)
    +"&azimuth=180&tilt="+(opt.tracking==="fixed"?opt.tilt:0)
    +"&array_type="+atype+"&module_type=0&losses=14&dc_ac_ratio="+opt.ilr
    +"&gcr="+opt.gcr+"&bifaciality="+(opt.module.bifaciality||0)+"&dataset=nsrdb";
  var lastErr;
  for(var b=0;b<base.length;b++){
    try{ var r=await fetch(ym_url(base[b]+q)); if(!r.ok){lastErr=new Error("NREL HTTP "+r.status); continue;}
      var j=await r.json(); if(j.errors&&j.errors.length){lastErr=new Error(j.errors.join("; ")); continue;}
      var ac=j.outputs.ac_annual; return {acAnnual:ac, syNet:ac/(opt.dcMWp*1000), source:"NREL PVWatts v8"+(p.yProxy?" (via proxy)":"")};
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error("NREL unreachable — needs the data proxy (CORS-blocked).");
}
// V22 — robust JSON fetch: reads the body as text first, so an HTML page (firewall "Request Rejected", maintenance,
//        rate-limit page) returned with HTTP 200 gives a clear message instead of "Unexpected token '<'".
async function ym_json(url, label, timeoutMs){
  var ctl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  var tmr = ctl ? setTimeout(function(){ try{ctl.abort();}catch(e){} }, timeoutMs||25000) : null;
  var r, txt;
  try{ r=await fetch(url, ctl?{signal:ctl.signal}:undefined); txt=await r.text(); }
  catch(e){ throw new Error(label+" unreachable ("+((e&&e.name==="AbortError")?"timeout":((e&&e.message)||e))+")"); }
  finally{ if(tmr) clearTimeout(tmr); }
  var t=(txt||"").trim();
  if(t.charAt(0)==="<"){
    var m=t.match(/<title>([^<]*)<\/title>/i), why=m?m[1].trim():"HTML page";
    if(/request rejected/i.test(t)) why="Request Rejected by the JRC firewall";
    throw new Error(label+" returned an HTML page instead of data ("+why+", HTTP "+r.status+")");
  }
  if(!r.ok){ var em=""; try{ em=(JSON.parse(t)||{}).error||""; }catch(e){} throw new Error(label+" HTTP "+r.status+(em?" — "+em:(t?": "+t.slice(0,120):""))); }
  try{ return JSON.parse(t); }catch(e){ throw new Error(label+" returned invalid JSON ("+t.slice(0,60)+"…)"); }
}
// PVGIS (SARAH3) — ressource mensuelle via l'endpoint TMY (nécessite le proxy: CORS bloqué par le JRC)
async function fetchPVGIS(lat,lon){
  if(!(p.yProxy||"").trim()) throw new Error("PVGIS requires a Data proxy URL (the JRC blocks direct browser calls).");
  var u="https://re.jrc.ec.europa.eu/api/v5_3/tmy?lat="+lat+"&lon="+lon+"&outputformat=json";
  var j;
  try{ j=await ym_json(ym_url(u),"PVGIS"); }
  catch(e1){ // one retry on the v5.2 endpoint (different path, sometimes not filtered)
    try{ j=await ym_json(ym_url(u.replace("/v5_3/","/v5_2/")),"PVGIS"); }catch(e2){ throw e1; }
  }
  var rows=(j.outputs&&(j.outputs.tmy_hourly||j.outputs.hourly))||[];
  if(!rows.length) throw new Error("PVGIS: empty TMY response.");
  var gh=new Array(12).fill(0), gd=new Array(12).fill(0), ts=new Array(12).fill(0), tc=new Array(12).fill(0);
  for(var i=0;i<rows.length;i++){
    var row=rows[i], tm=String(row["time(UTC)"]||row.time||"");
    var mo=parseInt(tm.slice(4,6),10)-1; if(mo<0||mo>11) continue;
    gh[mo]+= (+row["G(h)"]||0); gd[mo]+= (+row["Gd(h)"]||0);
    ts[mo]+= (+row["T2m"]||0); tc[mo]++;
  }
  var ghi=[],dhi=[],tamb=[];
  for(var m=0;m<12;m++){ ghi.push(gh[m]/1000); dhi.push(gd[m]/1000); tamb.push(tc[m]?ts[m]/tc[m]:25); }
  return {lat:+lat,lon:+lon,ghi:ghi,dhi:dhi,tamb:tamb,albedo:new Array(12).fill((+p.yAlbedo)||0.18),source:"PVGIS-SARAH3 (TMY, via proxy)"};
}

/* ---- construction des options moteur depuis l'état p ---- */
function ym_url(u){ var px=(p.yProxy||"").trim(); return px? (px.replace(/\/+$/,"")+"?url="+encodeURIComponent(u)) : u; }
function ym_opt(){
  var mod=YMODULES[p.yModule]||YMODULES.JinkoJKM640N;
  return { lat:+p.yLat, lon:+p.yLon, dcMWp:+p.pvMW, ilr:+p.dcac,
    module:{pmax:mod.pmax,area:mod.area,gamma:mod.gamma,bifaciality:mod.bifaciality},
    array:{tracking:p.yTrack,tilt:+p.yTilt,azimuth:180,gcr:(+p.yGCR)/100,maxAngle:(+p.yMaxAngle)||55,backtrack:true},
    gridKm:+p.yGridKm, gridKv:+p.yGridKv, uc:29, uv:0, shape:0.88 };
}

/* ---- runner (async) ---- */
window.runYieldEstimate = async function(){
  state.yieldEst={status:"loading"}; renderInputs();
  try{
    var opt=ym_opt(), res, out, model;
    if(p.ySource==="manual"){
      var ghi=ym_parse12(p.yGHI), tamb=ym_parse12(p.yTAMB), dhi=ym_parse12(p.yDHI);
      if(ghi.length<12||tamb.length<12) throw new Error("Manual input: 12 monthly values are required for GHI and ambient temperature (diffuse is optional).");
      res={lat:opt.lat,lon:opt.lon,ghi:ghi,tamb:tamb,dhi:dhi.length>=12?dhi:null,albedo:new Array(12).fill((+p.yAlbedo)||0.18),source:"Manual input"};
      out=YieldEngine.estimate(res,opt); model="AEG engine (manual resource)";
    } else if(p.ySource==="pvgis"){
      try{ res=await fetchPVGIS(opt.lat,opt.lon); model="AEG engine (PVGIS-SARAH3 resource)"; }
      catch(ePv){ // V22 — automatic fallback so the PM is never stuck: NASA POWER is CORS-open and needs no proxy
        res=await fetchNASA(opt.lat,opt.lon); model="AEG engine (NASA POWER resource — PVGIS fallback)";
        var fb="PVGIS unavailable — "+((ePv&&ePv.message)||ePv)+". NASA POWER used instead (coarser resource data: results can differ by a few % from SARAH3 — cross-check before relying on them).";
      }
      out=YieldEngine.estimate(res,opt); if(fb) out.fallback=fb;
    } else {
      res=await fetchNASA(opt.lat,opt.lon); out=YieldEngine.estimate(res,opt); model="AEG engine (NASA POWER resource)";
    }
    if(res&&res.source&&!out.source) out.source=res.source;
    out.model=model; out.status="ok"; state.yieldEst=out; renderInputs();
  }catch(e){
    state.yieldEst={status:"error",msg:(e&&e.message)||String(e)}; renderInputs();
  }
};
window.applyYield = function(which){
  var e=state.yieldEst; if(!e||e.status!=="ok") return;
  var p50=e.specificYieldPct.P50, pxx=e.specificYieldPct[which];
  p.yield=Math.round(p50); p.prodManual=false;
  if(which==="P90"||which==="P75"){ p.yieldScenario=(which==="P90")?"P90":"P50"; p.p90ratio=+(pxx/p50).toFixed(3); }
  else { p.yieldScenario="P50"; }
  updateDerived(); renderInputs(); renderResults();
};

/* ---- UI panel ---- */
function yieldEstimatorHTML(){
  var e=state.yieldEst, moduleOpts=Object.keys(YMODULES).map(function(k){return '<option value="'+k+'"'+(p.yModule===k?" selected":"")+'>'+YMODULES[k].label+'</option>';}).join("");
  var body="";
  body+=help("Upstream (pre-screening) estimate of P50/P75/P90 specific yield from site coordinates. Engine validated to within 1% of the bankable PVsyst report for Kong. Does not replace a PVsyst EYA at financial close.");
  body+='<div class="chips">'+chip("ySource","pvgis","PVGIS-SARAH3")+chip("ySource","nasa","NASA POWER")+chip("ySource","manual","Manual input")+'</div>';
  body+=field("Latitude","yLat","°")+field("Longitude","yLon","°");
  body+='<label class="fld"><span>Module</span><span class="ig"><select onchange="setSel(\'yModule\',this.value)" style="max-width:100%">'+moduleOpts+'</select></span></label>';
  body+='<div class="chips">'+chip("yTrack","single_axis","Single-axis tracker")+chip("yTrack","fixed","Fixed tilt")+'</div>';
  body+=field("GCR (ground cover ratio)","yGCR","%");
  if(p.yTrack==="fixed") body+=field("Tilt (fixed)","yTilt","°");
  else body+=field("Max tracker angle","yMaxAngle","°");
  body+='<label class="fld"><span>Albedo'+infoTip("Ground reflectance (drives the bifacial rear-side gain). With NASA POWER selected, the real monthly albedo is fetched from NASA (ALLSKY_SRF_ALB) and this value is used only as a fallback / for Manual input. Typical: 0.15–0.20 vegetation/soil, 0.25–0.35 sand.")+'</span><span class="ig"><input type="number" step="0.01" min="0.05" max="0.9" value="'+p.yAlbedo+'" oninput="setNum(\'yAlbedo\',this.value)" onblur="snapField(this,\'yAlbedo\')"><i></i></span></label>';
  body+=field("Grid connection distance","yGridKm","km")+field("Evacuation voltage","yGridKv","kV");
  if(p.ySource==="manual"){
    body+='<label class="fld col"><span>Monthly GHI (kWh/m², 12 values)</span><textarea class="tin" rows="2" style="resize:vertical;text-align:left;font-family:ui-monospace,monospace" oninput="setText(\'yGHI\',this.value)" placeholder="e.g. 178.7, 160.8, ...">'+esc(p.yGHI||"")+'</textarea></label>';
    body+='<label class="fld col"><span>Monthly ambient temp. (°C, 12 values)</span><textarea class="tin" rows="2" style="resize:vertical;text-align:left;font-family:ui-monospace,monospace" oninput="setText(\'yTAMB\',this.value)" placeholder="e.g. 26.8, 29.8, ...">'+esc(p.yTAMB||"")+'</textarea></label>';
    body+='<label class="fld col"><span>Monthly diffuse (kWh/m², optional)</span><textarea class="tin" rows="2" style="resize:vertical;text-align:left;font-family:ui-monospace,monospace" oninput="setText(\'yDHI\',this.value)" placeholder="optional">'+esc(p.yDHI||"")+'</textarea></label>';
  }
  body+='<div style="margin:10px 0"><button class="chip on" style="cursor:pointer" onclick="runYieldEstimate()">⚡ Compute P50 / P75 / P90</button></div>';
  // résultats
  if(e){
    if(e.status==="loading") body+=help("Computing… (fetching resource data)");
    else if(e.status==="error") body+='<div class="help" style="color:#c0392b">⚠ '+esc(e.msg)+'</div>';
    else if(e.status==="ok"){
      var sy=e.specificYieldPct, pr=e.productionGWhPct;
      var t='<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px">';
      t+='<tr style="border-bottom:1px solid var(--line)"><th style="text-align:left;padding:4px">Percentile</th><th style="text-align:right;padding:4px">kWh/kWp/yr</th><th style="text-align:right;padding:4px">GWh/yr</th><th></th></tr>';
      [["P50","P50"],["P75","P75"],["P90","P90"]].forEach(function(kk){
        t+='<tr><td style="padding:4px"><b>'+kk[0]+'</b></td><td style="text-align:right;padding:4px">'+Math.round(sy[kk[1]])+'</td><td style="text-align:right;padding:4px">'+pr[kk[1]].toFixed(2)+'</td>'
          +'<td style="text-align:right;padding:4px"><button class="chip" style="cursor:pointer;font-size:11px" onclick="applyYield(\''+kk[1]+'\')">Use</button></td></tr>';
      });
      t+='</table>';
      body+=t;
      if(e.fallback) body+='<div class="note">⚠ '+esc(e.fallback)+'</div>';
      body+=help("Source: "+esc(e.source||"")+" · "+esc(e.model||"")+" · uncertainty σ="+(e.sigma*100).toFixed(1)+"%"
        +(e.PRgross?(" · PR "+(e.PRgross*100).toFixed(1)+"% · POA "+Math.round(e.poaYear)+" kWh/m²"):"")
        +'. Yields are <b>at 100% availability and before degradation</b> (applied in the model). “Use” copies the P50 into the Specific yield field above and sets the P90/P50 ratio.');
    }
  }
  return collapse("yield_estimator","🌞 Yield estimator (P50/P75/P90)", body, false, (e&&e.status==="ok")?"on":"");
}


renderInputs(); renderResults();
